<!DOCTYPE html>
<html lang="{{language}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{pageDescription}}">
    <meta name="theme-color" content="#fefffe">
    <title>{{pageTitle}} | {{name}}</title>
    {{alternates}}
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body class="archive-page">
    {{icons}}
    <a class="skip-link" href="#main">{{skipToContent}}</a>
    <header class="site-header"><div class="container header-inner"><a class="brand" href="{{homeHref}}"><span class="brand-mark" aria-hidden="true">tl.</span><span class="brand-name">{{name}}<span>{{siteSubtitle}}</span></span></a><nav class="archive-nav" aria-label="{{mainNavigation}}"><a class="text-link" href="{{homeHref}}{{backAnchor}}"><svg aria-hidden="true"><use href="#icon-west"/></svg> {{backToHomepageLabel}}</a></nav>{{languageSwitch}}</div></header>
    <main id="main" class="container archive-main"><div class="archive-heading"><h1 class="section-title {{pageHeadingClass}}">{{pageHeadingIcon}}{{pageHeading}}</h1><p>{{pageIntro}}</p></div><div class="{{contentClass}}">{{content}}</div></main>
    <footer class="site-footer container"><span>&copy; {{year}} {{name}}</span><a class="text-link" href="{{homeHref}}">{{backHomeLabel}} <svg aria-hidden="true"><use href="#icon-arrow"/></svg></a></footer>
    {{dialog}}
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script id="citation-data" type="application/json">{{citations}}</script>
    <script id="ui-data" type="application/json">{{uiData}}</script>
</body>
</html>
